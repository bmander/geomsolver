# The slow tier every night, on main: `make test-slow` (tests of ten seconds to minutes, behind
# `feature = "slow"`), dealt across machines so the whole of it finishes in one night.  Nobody
# waits on it, so it may take hours; what matters is that it runs, and that a failure is seen —
# GitHub mails a failed scheduled run to whoever last changed this schedule, and the run's page
# names the test.  Run by hand (Actions -> slow -> Run workflow) on any branch before a change
# to the gear example or the native export lands.
#
# The core's suite is built once with the slow feature and handed to eight shards, as test.yml
# hands the fast one to four, so its fast tests run again here beside the slow ones: the slow
# build is a different build (`examples.rs` itself reads the feature).  Most slow tests are not
# in rust/test-times.tsv until someone times them (`scripts/test-times.sh -p gcs-core --test
# core --features gcs-core/slow`), so scripts/test-shard.sh weighs each missing one at a minute
# and deals them one by one.  OCCT's native tooth space stays a local run (`OCCT=1`).
name: slow

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: slow-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: slow-core-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            slow-core-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-
            slow-core-${{ runner.os }}-
      - name: Build the core's suite with the slow tier
        run: |
          cargo test --manifest-path rust/Cargo.toml -p gcs-core --test core \
              --features gcs-core/slow --no-run --message-format=json-render-diagnostics \
              > build.json
          mkdir -p suite
          cp "$(jq -r 'select(.profile.test == true) | .executable // empty' build.json)" suite/core
      - uses: actions/upload-artifact@v4
        with:
          name: core-suite-slow
          path: suite/core
          retention-days: 1

  core:
    needs: build
    name: core ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    # GitHub's ceiling for a hosted job is six hours
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # a test missing from rust/test-times.tsv is most likely one of the slow tier's long ones
      DEFAULT_SECONDS: 60
    steps:
      # the binary reads documents from the checkout, at the path it was built in
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-suite-slow
          path: suite
      - name: Shard ${{ matrix.shard }} of the core suite with the slow tier
        run: |
          chmod +x suite/core
          scripts/test-shard.sh ${{ matrix.shard }} 8 --binary suite/core rust/gcs-core

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: slow-cli-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            slow-cli-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-
            slow-cli-${{ runner.os }}-
      - name: The CLI's suite with the slow tier
        run: cargo test --manifest-path rust/Cargo.toml -p gcs-cli
          --features gcs-core/slow,gcs-cli/slow
