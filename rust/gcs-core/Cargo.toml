[package]
name = "gcs-core"
version = "0.1.0"
edition = "2021"
description = "Geometric constraint solver: model, numerics, diagnosis, decomposition — the whole engine."
# The suite is ONE test binary, `tests/main.rs`, with each `tests/*.rs` a module of it: see the
# note at the top of that file for what fifty binaries cost.
autotests = false

[dependencies]

# The library itself has no dependencies.  Its *tests* have one reference implementation:
# there is no LAPACK/BLAS here — the pivoted QR, the complete orthogonal decomposition, the
# SVD and the LU are ours — so `tests/linalg.rs` compares them against an independent one.
# Nothing here links into the cdylib or the wasm; only the test binary.
[dev-dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["std"] }

[lib]
name = "gcs_core"
path = "src/lib.rs"
# Tests live in the integration suite below; don't compile the engine again as an
# empty unit-test executable. Documentation tests remain enabled.
test = false

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
test = false

[[test]]
name = "core"
path = "tests/main.rs"
