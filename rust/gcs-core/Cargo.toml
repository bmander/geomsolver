[package]
name = "gcs-core"
version = "0.1.0"
edition = "2021"
description = "Geometric constraint solver: the Solvent language and what is built on it, over gcs-solve."
# The suite is ONE test binary, `tests/main.rs`, with each `tests/*.rs` a module of it: see the
# note at the top of that file for what fifty binaries cost.
autotests = false

[dependencies]
# The solver, which knows no Solvent (#409, step 7).  Its modules are re-exported by name.
gcs-solve = { path = "../gcs-solve" }

# Nor does the engine have any outside the workspace.  Its *tests* have one reference
# implementation: there is no LAPACK/BLAS here — the pivoted QR, the complete orthogonal
# decomposition, the SVD and the LU are ours (in `gcs-solve`) — so `tests/linalg.rs` compares
# them against an independent one.  Nothing here links into the cdylib or the wasm; only the
# test binary.
[dev-dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
# The fixtures the core's and the CLI's suites share (`rust/fixtures`), written once.
fixtures = { path = "../fixtures" }

[lib]
name = "gcs_core"
path = "src/lib.rs"
# Tests live in the integration suite below; don't compile the engine again as an
# empty unit-test executable. Documentation tests remain enabled.
test = false

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
test = false

[[test]]
name = "core"
path = "tests/main.rs"

[features]
# The slow tier: tests of ten seconds or more, run by `make test-slow`.
slow = []
# The CalculiX oracle of #510's verification corpus, run by `make test-ccx` with `ccx` and `gmsh`
# on the path.
ccx = []
