[package]
name = "gcs-cli"
version = "0.1.0"
edition = "2021"
description = "solventc: check a Solvent document from the command line."

# The CLI's dependencies are the CLI's.  Nothing here reaches the cdylib or the wasm — the same
# argument the core's test reference implementation makes — but there is nothing here anyway:
# four flags and a list of paths do not need an argument parser.
[dependencies]
gcs-core = { path = "../gcs-core" }

[features]
# The slow tier: tests of ten seconds or more, run by `make test-slow`.
slow = []
occt = []

[dev-dependencies]
gcs-core = { path = "../gcs-core" }
fixtures = { path = "../fixtures" }

[[bin]]
name = "solventc"
path = "src/main.rs"
# tests/cli.rs runs the real binary; there are no in-source unit tests.
test = false

[[test]]
name = "native_surfaces"
path = "tests/native_surfaces.rs"
required-features = ["occt"]

[[test]]
name = "generating_harness"
path = "tests/generating_harness.rs"
required-features = ["occt"]

[[test]]
name = "native_boundary"
path = "tests/native_boundary.rs"
required-features = ["occt"]

[[test]]
name = "native_measure"
path = "tests/native_measure.rs"
required-features = ["occt"]

[[test]]
name = "native_sector"
path = "tests/native_sector.rs"
required-features = ["occt"]
