[package]
name = "gcs-ffi"
version = "0.1.0"
edition = "2021"
description = "Flat C ABI over gcs-core: one library, built as WebAssembly and as a native cdylib."

[dependencies]
gcs-core = { path = "../gcs-core" }

[lib]
name = "gcs"
# `rlib` so `tests/` can link the ABI and check the panic boundary on the native
# target — the one thing `wasm32-unknown-unknown` cannot check, since it aborts.
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"
