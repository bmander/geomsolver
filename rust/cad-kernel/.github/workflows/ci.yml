# The crate on its own (this directory is geomsolver's rust/cad-kernel, synced here): it builds
# with no dependencies, natively and for wasm, and its smoke test passes.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --release
      - run: cargo build --release --target wasm32-unknown-unknown
