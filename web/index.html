<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gcs sketcher</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f4f4f5;
    --line: #d8d8dc;
    --text: #1b1b1f;
    --muted: #6b6b74;
    --accent: #1f77b4;
    --accent-soft: #e6f0f7;
    --danger: #b3001b;
    --danger-bg: #fdecea;
    --warn: #7a4a00;
    --warn-bg: #fff4e0;
    --row-sel: #fce4f3;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header { border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 5px 8px; }
  .bar > * { flex: none; }        /* wrap onto a new row rather than shrinking to a sliver */
  .bar + .bar { border-top: 1px solid var(--line); }
  .bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }

  button, select {
    font: inherit; color: inherit;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 9px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; border-color: var(--line); }
  button kbd { font: inherit; color: var(--muted); margin-left: 4px; }
  label.check { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--text); }

  /* the menu bar.  It behaves like a desktop one: a click opens a menu, and while any menu
     is open the others take over on hover.  Which one is down is recorded once, in the top
     button's aria-expanded, and the list is dropped off that. */
  .menubar { gap: 2px; padding: 2px 6px; }
  .menu { position: relative; }
  .menu > button { background: none; border: 1px solid transparent; padding: 3px 10px; }
  .menu > button:hover, .menu > button[aria-expanded="true"] {
    background: var(--accent-soft); border-color: transparent; color: var(--accent);
  }
  .menu ul {
    display: none; position: absolute; top: calc(100% + 2px); left: 0; z-index: 20;
    min-width: 200px; margin: 0; padding: 4px; list-style: none;
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .menu:has(> button[aria-expanded="true"]) ul { display: block; }
  .menubar .brand {
    padding: 2px 7px; margin-right: 4px; font-weight: 600; letter-spacing: .04em;
    background: none; color: var(--accent); border-color: var(--accent);
  }
  .menubar .brand:hover { background: var(--accent-soft); }
  .menu li.sep { height: 1px; margin: 4px 2px; background: var(--line); }
  .menu li > button {
    display: flex; width: 100%; gap: 24px; justify-content: space-between;
    background: none; border: 0; padding: 4px 8px; white-space: nowrap;
  }
  .menu li > button:hover { background: var(--accent-soft); color: var(--accent); }

  #banner { display: none; align-items: center; gap: 10px; padding: 7px 12px; font-weight: 600; flex: none; }
  #banner.conflict { display: flex; background: var(--danger-bg); color: #8a0000; border-bottom: 1px solid #d62728; }
  #banner.over { display: flex; background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid #e69500; }
  #banner-text { flex: 1; min-width: 0; }

  main { flex: 1; display: flex; min-height: 0; }
  #canvas-wrap { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  canvas.select { cursor: default; }

  aside {
    width: 310px; flex: none; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; background: var(--panel); min-height: 0;
  }
  /* the two panes split the sidebar and scroll independently, so a long constraint list
     never pushes the component list off the bottom */
  aside section { display: flex; flex-direction: column; min-height: 0; flex: 1 1 0; }
  aside section + section { border-top: 1px solid var(--line); }
  aside h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    margin: 0; padding: 8px 10px 6px; border-bottom: 1px solid var(--line); flex: none;
  }
  aside ul { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; font-family: var(--mono); font-size: 12px; }
  aside li { padding: 3px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside li:hover { background: #e9e9ed; }
  aside li[aria-current="true"] { outline: 1px solid var(--accent); outline-offset: -1px; }
  aside li.touches { background: var(--row-sel); font-weight: 600; }
  #clist li.culprit { color: var(--danger); }
  #clist li.violated { color: #d62728; }
  #clist li.over { color: #b06d00; }
  #clist li.implied { color: var(--muted); font-style: italic; }
  /* the component list mirrors the constraint list: strong for what is selected, soft for
     what the focused constraint reaches */
  #elist li.touches { background: var(--accent-soft); font-weight: 400; }
  #elist li.sel { background: var(--row-sel); font-weight: 600; }
  #elist li.construction { font-style: italic; color: var(--muted); }

  footer {
    flex: none; border-top: 1px solid var(--line); background: var(--panel);
    padding: 5px 10px; font-family: var(--mono); font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow-x: auto;
  }
  footer #toast { color: var(--text); }
  /* the geometry on screen does not satisfy the constraints — the numbers in the status
     line are describing a sketch you are not actually looking at */
  footer.unsolved { background: var(--danger-bg); border-top-color: #d62728; color: #a03b46; }
  footer.unsolved #toast { color: #8a0000; }

  dialog {
    border: 1px solid var(--line); border-radius: 9px; padding: 0;
    max-width: min(94vw, 900px); max-height: 86vh; color: var(--text); background: var(--bg);
    box-shadow: 0 12px 40px rgba(0,0,0,.22);
  }
  dialog::backdrop { background: rgba(0,0,0,.28); }
  dialog h3 { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  dialog .body { padding: 12px 16px; overflow: auto; max-height: 62vh; }
  dialog pre { font-family: var(--mono); font-size: 12px; margin: 0; white-space: pre; }
  dialog p { margin: 0 0 8px; }
  dialog p:last-child { margin-bottom: 0; }
  dialog a { color: var(--accent); text-decoration: none; }
  dialog a:hover { text-decoration: underline; }
  /* the About diagram: what the sketcher is made of, in the order it was made */
  .dag { display: block; width: 360px; max-width: 100%; height: auto; margin: 12px auto; }
  .dag rect { fill: var(--accent-soft); stroke: var(--accent); }
  .dag text { fill: var(--text); font: 11px system-ui, -apple-system, sans-serif; }
  .dag path { fill: none; stroke: var(--muted); stroke-width: 1.2; }
  .dag marker path { fill: var(--muted); stroke: none; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
  dialog input[type=number], dialog input[type=text] {
    font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px;
  }
  dialog .choices { display: flex; flex-direction: column; gap: 4px; }
  /* a settings sheet: one control per row, each taking effect as it is switched */
  dialog .fields { display: flex; flex-direction: column; gap: 10px; }
  dialog .fields label.check { display: flex; }
  dialog .choices button { text-align: left; font-family: var(--mono); font-size: 12px; }

  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); background: var(--bg); }

  /* the measurement readout: pinned to the canvas's lower right, only while two things are picked */
  #measure {
    position: absolute; right: 12px; bottom: 12px; display: none;
    padding: 7px 11px; border: 1px solid var(--line); border-radius: 7px;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    font-family: var(--mono); font-size: 12px; line-height: 1.5;
    pointer-events: none; white-space: pre; text-align: right;
  }
  #measure.on { display: block; }
  #measure b { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="bar menubar" id="menubar">
      <button class="brand" id="about" title="About this project">gcs</button>
    </div>
    <div class="bar" id="bar-tools"></div>
    <div class="bar" id="bar-constraints"></div>
  </header>
  <div id="banner"><span id="banner-text"></span><button id="banner-select">Select culprits</button></div>
  <main>
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="loading">loading solver…</div>
      <div id="measure" aria-live="polite"></div>
    </div>
    <aside>
      <section>
        <h2>Constraints</h2>
        <ul id="clist"></ul>
      </section>
      <section>
        <h2>Components</h2>
        <ul id="elist"></ul>
      </section>
    </aside>
  </main>
  <footer><span id="toast"></span><span id="stats"></span></footer>
</div>
<dialog id="modal">
  <h3 id="modal-title"></h3>
  <div class="body" id="modal-body"></div>
  <div class="actions" id="modal-actions"></div>
</dialog>
<template id="about-dag">
  <svg class="dag" viewBox="0 0 360 228" role="img"
       aria-label="Thirty-five years of research, to a mechanical implementation, to Rust, to the WASM/TypeScript and Python bindings">
    <defs>
      <marker id="dag-arrow" viewBox="0 0 8 8" refX="7" refY="4"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L8 4 L0 8 z"/>
      </marker>
    </defs>
    <rect x="105" y="8" width="150" height="30" rx="6"/>
    <text x="180" y="27" text-anchor="middle">35 years of research</text>
    <rect x="90" y="66" width="180" height="30" rx="6"/>
    <text x="180" y="85" text-anchor="middle">Mechanical implementation</text>
    <rect x="145" y="124" width="70" height="30" rx="6"/>
    <text x="180" y="143" text-anchor="middle">Rust</text>
    <rect x="5" y="190" width="175" height="30" rx="6"/>
    <text x="92" y="209" text-anchor="middle">WASM/TypeScript bindings</text>
    <rect x="240" y="190" width="120" height="30" rx="6"/>
    <text x="300" y="209" text-anchor="middle">Python bindings</text>
    <path d="M180 38 V64" marker-end="url(#dag-arrow)"/>
    <path d="M180 96 V122" marker-end="url(#dag-arrow)"/>
    <path d="M180 154 L92 188" marker-end="url(#dag-arrow)"/>
    <path d="M180 154 L300 188" marker-end="url(#dag-arrow)"/>
  </svg>
</template>
<script type="module" src="./dist/app/main.js"></script>
</body>
</html>
