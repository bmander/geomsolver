<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- the page never zooms: the canvas pinches its own camera, and a phone zooming in on a text
     field it focuses would leave the drawing half off screen -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>gcs sketcher</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="app">
  <header>
    <div class="bar menubar" id="menubar">
      <button class="brand" id="about" title="About this project">gcs</button>
    </div>
    <div class="bar" id="bar-tools"></div>
    <div class="bar" id="bar-constraints"></div>
  </header>
  <div id="banner"><span id="banner-text"></span><button id="banner-select">Select culprits</button></div>
  <main>
    <div id="canvas-wrap">
      <!-- the workspace's depth — solids, panes — rendered by three.js.  Under the sketch canvas
           and taking no pointer events: every gesture runs against the 2D one, which strokes each
           sketch on its own plane over it. -->
      <canvas id="box"></canvas>
      <canvas id="canvas"></canvas>
      <!-- the viewport's choosers, in its upper right: the plane drawn on, and — where the
           document states one — the load scenario drawn over the workspace, its card unfolding
           beneath it once one is chosen.  Filled by `main` and `scenario-card` -->
      <div id="view-picks">
        <div class="picks">
          <label id="scenario-pick" hidden title="A load scenario the document states — choosing one draws its supports and loads, and how the drawing moves under it; None draws none">
            <span>Scenario</span>
            <select id="scenario-select" aria-label="Load scenario"></select>
          </label>
          <label id="plane-pick" title="The plane the next thing is drawn on — choosing one also turns the view square on to it; None draws points and lines in space">
            <span>Sketch on</span>
            <select id="plane-select" aria-label="Sketch plane"></select>
          </label>
        </div>
        <section id="scenario-card" hidden aria-label="Load scenario">
          <header>
            <label id="scenario-exaggerate" title="How many times the moves are drawn larger than they are: at the left, as they are">
              <span>Exaggerate</span>
              <input id="scenario-scale" type="range" min="0" max="1000" step="1" aria-label="Exaggeration">
              <output id="scenario-scale-text" for="scenario-scale"></output>
            </label>
            <label title="Swing the drawing from rest to its exaggerated shape and back"><input id="scenario-animate" type="checkbox"> Animate</label>
            <label title="Draw the edges of the mesh that was solved"><input id="scenario-mesh" type="checkbox"> Mesh</label>
          </header>
          <div id="scenario-legend" aria-label="Moves">
            <span id="scenario-legend-lo">0</span>
            <span id="scenario-ramp"></span>
            <span id="scenario-legend-hi"></span>
          </div>
          <p id="scenario-status" role="status"></p>
          <ul id="scenario-lines"></ul>
        </section>
      </div>
      <!-- the workspace's own buttons, in its corner where a thumb finds them: filled by `main` -->
      <div id="view-buttons" aria-label="Workspace"></div>
      <section id="drawing-view" aria-label="Drawing view" hidden>
        <div class="drawing-toolbar">
          <label>Sheet <select id="drawing-sheet" aria-label="Sheet"></select></label>
          <button id="drawing-render">Render</button>
          <button id="drawing-zoom-out" aria-label="Zoom out">−</button>
          <span id="drawing-zoom" aria-label="Drawing zoom">100%</span>
          <button id="drawing-zoom-in" aria-label="Zoom in">+</button>
          <button id="drawing-fit" title="Fit the sheet in the drawing view (0)">Fit sheet</button>
          <button id="drawing-export">Export SVG</button>
        </div>
        <div id="drawing-viewport" tabindex="0" aria-label="Drawing preview"
             title="Scroll to zoom; drag to pan. Keyboard: +/− zoom, arrow keys pan, 0 fits the sheet.">
          <img id="drawing-image" alt="Drawing sheet" draggable="false">
        </div>
        <p id="drawing-status" role="status"></p>
      </section>
      <!-- a row per parameter the drawing declares, its interval a slider: filled by `timeline` -->
      <div id="timeline" aria-label="Parameters" hidden></div>
      <div id="measure" aria-live="polite"></div>
      <div id="cpanel" hidden>
        <h2 id="cpanel-title"></h2>
        <ul id="clist"></ul>
      </div>
    </div>
    <div id="psplit" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize the program panel"></div>
    <aside id="ppanel" data-side="program">
      <!-- the panel's head: which one of its panes the column shows, and that pane's own buttons
           (`program.ts::showSide`).  On a narrow screen the panel is a drawer above the footer,
           and the head is what folds it (`program.ts::bindDrawer`) -->
      <div id="ppanel-head">
        <button id="ppanel-fold" type="button" aria-expanded="true" title="Fold the panel away"
                aria-label="Fold the panel away">
          <svg class="project-disclosure" aria-hidden="true" viewBox="0 0 24 24">
            <path d="m9 5 7 7-7 7"/>
          </svg>
        </button>
        <!-- Project is offered while one is open (`program.ts::offerProject`) -->
        <select id="ppanel-side" aria-label="What the panel shows">
          <option value="program">Program</option>
          <option value="outline">Model</option>
        </select>
        <span id="ppanel-state"></span>
        <button id="outline-isolate" class="side-outline" type="button"
                title="Hide everything but the selection and what made it (I in the outline)">Isolate</button>
        <button id="outline-show-all" class="side-outline" type="button"
                title="Show everything again (⇧I)">Show all</button>
        <button id="program-compile" class="side-program" type="button"
                title="Compile the source and solve it again (⌘↵ while typing in it)">Compile</button>
      </div>
      <section id="project-pane" aria-label="Project directory">
        <h2 id="project-title">Project</h2>
        <nav id="project-tree" aria-label="Project files"></nav>
      </section>
      <!-- every instance the document makes and its members: filled by `app/outline.ts` -->
      <section id="outline-pane" aria-label="Model outline">
        <div id="outline-tree" role="tree" aria-label="Model outline" tabindex="0" hidden></div>
      </section>
      <div id="program-name" hidden></div>
      <label id="program-files" hidden>File
        <select id="program-file" aria-label="Project file"></select>
      </label>
      <!-- the two layers of the code box are `app/editor.ts`'s, and it builds them here -->
      <div id="pcode" class="code-host"></div>
      <ul id="pdiags"></ul>
    </aside>
  </main>
  <footer><span id="toast"></span><span id="component"></span><span id="stats"></span><span id="refine"></span><span id="claims"></span><span id="scenarios"></span></footer>
</div>
<!-- while the page has nothing worth touching: the solver starting, an example arriving, its solve,
     its swept solids' first surfaces (`app/loading.ts`) -->
<div id="loading" role="progressbar" aria-busy="true" aria-labelledby="loading-label">
  <div class="loading-card">
    <p id="loading-label">loading solver…</p>
    <div class="loading-bar"><div id="loading-fill"></div></div>
  </div>
</div>
<dialog id="modal">
  <h3 id="modal-title"></h3>
  <div class="body" id="modal-body"></div>
  <div class="actions" id="modal-actions"></div>
</dialog>
<template id="about-dag">
  <svg class="dag" viewBox="0 0 360 228" role="img"
       aria-label="Thirty-five years of research, to a mechanical implementation, to Rust, to the WASM/TypeScript binding">
    <defs>
      <marker id="dag-arrow" viewBox="0 0 8 8" refX="7" refY="4"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L8 4 L0 8 z"/>
      </marker>
    </defs>
    <rect x="105" y="8" width="150" height="30" rx="6"/>
    <text x="180" y="27" text-anchor="middle">35 years of research</text>
    <rect x="90" y="66" width="180" height="30" rx="6"/>
    <text x="180" y="85" text-anchor="middle">Mechanical implementation</text>
    <rect x="145" y="124" width="70" height="30" rx="6"/>
    <text x="180" y="143" text-anchor="middle">Rust</text>
    <rect x="92" y="190" width="175" height="30" rx="6"/>
    <text x="180" y="209" text-anchor="middle">WASM/TypeScript binding</text>
    <path d="M180 38 V64" marker-end="url(#dag-arrow)"/>
    <path d="M180 96 V122" marker-end="url(#dag-arrow)"/>
    <path d="M180 154 V188" marker-end="url(#dag-arrow)"/>
  </svg>
</template>
<script type="module" src="./dist/app/bundle.js"></script>
</body>
</html>
