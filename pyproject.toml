[project]
name = "gcs"
version = "0.0.1"
description = "Geometric constraint solver — the numpy/scipy reference implementation"
requires-python = ">=3.14"
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "mypy", "scipy-stubs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/gcs"]
